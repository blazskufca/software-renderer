name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Original renderer, PR #1 with scalar kernels, PR #1 with SIMD kernels.
      - run: make test

  test-wasm:
    name: Test (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: make test-wasm

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      # The PR head commit, not the merge commit, so covered lines map onto the diff.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make cover
      # Pushes to master set the baseline; on PRs github-code-quality[bot]
      # comments the change. The action skips PRs from forks (read-only token).
      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage/coverage.xml
          language: Go
          label: code-coverage/go

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Native
        run: |
          make build
          make build SIMD=1
      - name: WebAssembly
        run: |
          make web
          make web SIMD=1
