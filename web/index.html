<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Software Renderer — WebAssembly demo</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #eee;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    /* Ebiten creates and appends its own <canvas> to the body. */
    canvas {
      display: block;
    }
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #000;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #333;
      border-top-color: #4fc3f7;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { font-size: 0.95rem; color: #9aa; }
    #hint {
      position: fixed;
      left: 8px;
      bottom: 8px;
      font-size: 0.8rem;
      color: #889;
      z-index: 5;
      pointer-events: none;
    }
    #error {
      max-width: 80ch;
      padding: 1rem;
      color: #ff8a80;
      font-family: monospace;
      white-space: pre-wrap;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <div class="spinner"></div>
    <div id="status">Loading…</div>
    <div id="error"></div>
  </div>
  <div id="hint">Click to capture mouse · WASD to move · Space to jump · 1–6 render modes · C/X cull · Esc releases mouse</div>

  <script src="wasm_exec.js"></script>
  <script src="main.js"></script>
</body>
</html>
